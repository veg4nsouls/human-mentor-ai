<title>Intake — Human Mentor AI</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Space Grotesk',sans-serif;background:#1D1E25;color:#F6F3EE;min-height:100vh;display:flex;flex-direction:column}
button{font-family:'Space Grotesk',sans-serif;cursor:pointer}
a{text-decoration:none;color:inherit}

/* Subtle background */
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 800px 500px at 20% -10%,rgba(50,160,190,.09) 0%,transparent 60%),radial-gradient(ellipse 600px 400px at 80% 110%,rgba(111,155,255,.07) 0%,transparent 60%);pointer-events:none;z-index:0}

/* Top bar */
.topbar{height:60px;background:rgba(18,19,25,.95);border-bottom:1px solid rgba(246,243,238,.06);display:flex;align-items:center;padding:0 32px;position:relative;z-index:10;backdrop-filter:blur(10px)}
.logo{display:flex;align-items:center;gap:8px}
.logo-box{width:20px;height:20px;border:1px solid rgba(246,243,238,.25);border-radius:3px;display:flex;align-items:center;justify-content:center}
.logo-name{font-size:14px;font-weight:700;letter-spacing:.06em}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:16px}
.lang-toggle{display:flex;align-items:center;background:none;border:1px solid rgba(246,243,238,.15);border-radius:20px;padding:2px;gap:0}
.lang-tab{padding:3px 10px;border-radius:16px;font-size:10px;font-weight:700;letter-spacing:.06em;transition:.15s;cursor:pointer;border:none}
.lang-tab.active{background:#6F9BFF;color:#060d0a}
.lang-tab.inactive{background:none;color:rgba(246,243,238,.5)}
.home-link{font-size:13px;color:rgba(246,243,238,.65);font-weight:500}
.home-link:hover{color:#F6F3EE}

/* Layout */
.intake-wrap{flex:1;display:flex;flex-direction:column;align-items:center;padding:40px 20px 60px;position:relative;z-index:10}

/* Step indicator */
.steps-bar{display:flex;align-items:center;gap:0;margin-bottom:40px;width:100%;max-width:540px}
.step-dot{width:8px;height:8px;border-radius:50%;background:rgba(246,243,238,.15);transition:.35s;flex-shrink:0}
.step-dot.done{background:#6F9BFF}
.step-dot.current{background:#F6F3EE;box-shadow:0 0 0 3px rgba(246,243,238,.15)}
.step-line{flex:1;height:1px;background:rgba(246,243,238,.1);transition:.35s}
.step-line.done{background:#6F9BFF}
.step-label{font-size:12px;font-weight:600;color:rgba(246,243,238,.75);letter-spacing:.1em;text-transform:uppercase;text-align:right;width:100%;max-width:540px;margin-bottom:8px}

/* Card */
.card{width:100%;max-width:540px;background:rgba(246,243,238,.03);border:1px solid rgba(246,243,238,.08);border-radius:20px;padding:32px 36px 28px}
.q-cat{font-size:11px;font-weight:700;color:#6F9BFF;letter-spacing:.14em;text-transform:uppercase;margin-bottom:10px}
.q-title{font-family:'Barlow Condensed',sans-serif;font-size:44px;font-weight:800;color:#F6F3EE;text-transform:uppercase;line-height:.95;letter-spacing:.01em;margin-bottom:10px}
.q-sub{font-size:15px;color:rgba(246,243,238,.72);line-height:1.6;margin-bottom:24px}

/* Options */
.options{display:flex;flex-direction:column;gap:8px;margin-bottom:28px}
.option{display:flex;align-items:flex-start;gap:14px;padding:14px 16px;background:rgba(246,243,238,.03);border:1px solid rgba(246,243,238,.08);border-radius:12px;text-align:left;width:100%;transition:.15s}
.option:hover{border-color:rgba(111,155,255,.3);background:rgba(111,155,255,.05)}
.option.selected{background:rgba(111,155,255,.1);border-color:#6F9BFF}
.opt-icon{width:36px;height:36px;background:rgba(246,243,238,.06);border:1px solid rgba(246,243,238,.1);border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:18px}
.option.selected .opt-icon{background:rgba(111,155,255,.15);border-color:rgba(111,155,255,.3)}
.opt-title{font-size:15px;font-weight:600;color:#F6F3EE;margin-bottom:2px;line-height:1.3}
.opt-desc{font-size:15px;color:rgba(246,243,238,.7);line-height:1.45}

/* Textarea */
.free-wrap{margin-bottom:28px}
.free-input{width:100%;min-height:120px;background:rgba(246,243,238,.04);border:1px solid rgba(246,243,238,.1);border-radius:12px;padding:16px;font-family:'Space Grotesk',sans-serif;font-size:16px;color:#F6F3EE;resize:vertical;outline:none;transition:.2s}
.free-input::placeholder{color:rgba(246,243,238,.65)}
.free-input:focus{border-color:rgba(111,155,255,.4);background:rgba(111,155,255,.04)}
.free-hint{font-size:15px;color:rgba(246,243,238,.65);margin-top:8px;line-height:1.5}

/* Buttons */
.btn-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.btn-back{background:none;border:none;font-size:17px;font-weight:500;color:rgba(246,243,238,.8);padding:0;display:flex;align-items:center;gap:5px}
.btn-back:hover{color:#F6F3EE}
.btn-next{display:flex;align-items:center;justify-content:center;gap:12px;background:#6F9BFF;border:none;border-radius:14px;padding:18px 24px;font-size:21px;font-weight:800;color:#060d0a;letter-spacing:-.01em;margin-left:auto;transition:box-shadow .2s,transform .15s;cursor:pointer}
.btn-next:hover{box-shadow:0 4px 24px rgba(111,155,255,.35);transform:translateY(-1px)}
.btn-next:active{transform:translateY(0)}
.btn-next:disabled{opacity:.4;cursor:default;box-shadow:none}

/* Name fields */
.name-fields{display:flex;flex-direction:column;gap:12px;margin-bottom:28px}
.field-label{font-size:15px;font-weight:600;color:rgba(246,243,238,.75);letter-spacing:.06em;text-transform:uppercase;margin-bottom:5px}
.field-input{width:100%;background:rgba(246,243,238,.04);border:1px solid rgba(246,243,238,.1);border-radius:10px;padding:13px 16px;font-family:'Space Grotesk',sans-serif;font-size:16px;color:#F6F3EE;outline:none;transition:.2s}
.field-input::placeholder{color:rgba(246,243,238,.45)}
.field-input:focus{border-color:rgba(111,155,255,.4)}

/* Result screen */
.result-card{width:100%;max-width:540px;background:rgba(246,243,238,.03);border:1px solid rgba(246,243,238,.08);border-radius:20px;padding:36px;text-align:center}
.result-icon{width:64px;height:64px;background:rgba(111,155,255,.12);border:1px solid rgba(111,155,255,.25);border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 24px;font-size:30px}
.result-h1{font-family:'Barlow Condensed',sans-serif;font-size:46px;font-weight:800;color:#F6F3EE;text-transform:uppercase;margin-bottom:14px;line-height:.95}
.result-sub{font-size:17px;color:rgba(246,243,238,.72);line-height:1.65;margin-bottom:28px}
.result-cta{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;background:#6F9BFF;border:none;border-radius:12px;padding:16px 24px;font-size:18px;font-weight:700;color:#060d0a}
.result-restart{margin-top:14px;background:none;border:none;font-size:14px;color:rgba(246,243,238,.5);font-weight:500}
.result-restart:hover{color:rgba(246,243,238,.8)}
</style>
</head>

function c(){ return T[lang]; }
function q(){ return c().questions; }

function toggleLang(){ lang = lang==='es'?'en':'es'; try{localStorage.setItem('hm_lang',lang);}catch(e){} renderAll(); }
function setLang(l){ lang=l; try{localStorage.setItem('hm_lang',l);}catch(e){} renderAll(); }

function renderAll(){
  document.documentElement.lang = lang;
  document.getElementById('tab-es').className = 'lang-tab'+(lang==='es'?' active':' inactive');
  document.getElementById('tab-en').className = 'lang-tab'+(lang==='en'?' active':' inactive');
  document.getElementById('lbl-home').textContent = c().home;
  renderStep();
}

function renderStepsBar(){
  var total = q().length;
  var bar = document.getElementById('steps-bar');
  var html = '';
  for(var i=0;i<total;i++){
    if(i>0) html += '<div class="step-line'+(i<=step?' done':'')+'"></div>';
    var cls = i<step?'done':i===step?'current':'';
    html += '<div class="step-dot'+( cls?' '+cls:'')+'"></div>';
  }
  bar.innerHTML = html;
  if(step < total){
    document.getElementById('lbl-step').textContent = c().stepLabel(step, total);
  } else {
    document.getElementById('lbl-step').textContent = '';
  }
}

function renderStep(){
  renderStepsBar();
  var qs = q();
  if(step >= qs.length){ renderResult(); return; }
  var qdata = qs[step];
  var screen = document.getElementById('screen');

  // Resolve dynamic data for sub_options type
  var rd = qdata;
  if(qdata.type==='sub_options'){
    var sub = c().subOptions[answers.challenge];
    if(sub) rd = {cat:sub.cat,title:sub.title,sub:sub.sub,type:'options',key:qdata.key,options:sub.options};
  }

  var html = '<div class="card">'
    +'<div class="q-cat">'+rd.cat+'</div>'
    +'<h1 class="q-title">'+rd.title+'</h1>'
    +'<p class="q-sub">'+rd.sub+'</p>';

  if(rd.type==='options'){
    html += '<div class="options">';
    rd.options.forEach(function(opt,oi){
      var sel = answers[rd.key]===oi;
      html += '<button class="option'+(sel?' selected':'')+'" onclick="selectOpt('+oi+')">'
        +'<div class="opt-icon">'+opt.icon+'</div>'
        +'<div><div class="opt-title">'+opt.title+'</div><div class="opt-desc">'+opt.desc+'</div></div>'
        +'</button>';
    });
    html += '</div>';
  } else if(rd.type==='multi_options'){
    html += '<div class="options">';
    rd.options.forEach(function(opt,oi){
      var sel = answers[rd.key] && answers[rd.key].indexOf(oi)!==-1;
      html += '<button class="option'+(sel?' selected':'')+'" onclick="selectMultiOpt('+oi+')">'
        +'<div class="opt-icon">'+opt.icon+'</div>'
        +'<div><div class="opt-title">'+opt.title+'</div><div class="opt-desc">'+opt.desc+'</div></div>'
        +'</button>';
    });
    html += '</div>';
  } else if(rd.type==='name'){
    html += '<div class="name-fields">'
      +'<div><div class="field-label">'+(lang==='es'?'Nombre o apodo':'Name or nickname')+'</div>'
      +'<input class="field-input" type="text" id="inp-name" placeholder="'+(lang==='es'?'Tu nombre...':'Your name...')+'" value="'+(answers.name||'')+'" oninput="answers.name=this.value"></div>'
      +'</div>';
  } else if(rd.type==='free'){
    html += '<div class="free-wrap">'
      +'<textarea class="free-input" id="inp-story" placeholder="'+qdata.placeholder+'" oninput="answers.story=this.value">'+( answers.story||'')+'</textarea>'
      +'<div class="free-hint">'+qdata.hint+'</div>'
      +'</div>';
  }

  html += '<div class="btn-row">';
  html += '<button class="btn-back" onclick="goBack()">'+c().back+'</button>';

  var isLast = step===qs.length-1;
  var canContinue = true;
  if(rd.type==='options' && answers[rd.key]===undefined) canContinue=false;
  if(rd.type==='multi_options' && (!answers[rd.key] || !answers[rd.key].length)) canContinue=false;
  html += '<button class="btn-next" onclick="goNext()" '+(canContinue?'':'disabled')+'>'
    +(isLast?c().finish:c().next)+' '+c().next_arrow+'</button>';
  html += '</div></div>';

  screen.innerHTML = html;
}

function selectOpt(i){
  var key = q()[step].key;
  if(key==='challenge'){ delete answers.challenge_detail; }
  answers[key] = i;
  renderStep();
}

function selectMultiOpt(i){
  var key = q()[step].key;
  if(!answers[key]) answers[key] = [];
  var idx = answers[key].indexOf(i);
  if(idx===-1){ answers[key].push(i); }
  else { answers[key].splice(idx,1); }
  renderStep();
}

function goNext(){
  var qdata = q()[step];
  var rdKey = qdata.key;
  var rdType = qdata.type==='sub_options' ? 'options' : qdata.type;
  if(rdType==='options' && answers[rdKey]===undefined) return;
  if(rdType==='multi_options' && (!answers[rdKey] || !answers[rdKey].length)) return;
  step++;
  renderStep();
  window.scrollTo(0,0);
}

function goBack(){
  if(step>0){ step--; renderStep(); window.scrollTo(0,0); }
  else { window.location.href='index.html'; }
}

function renderResult(){
  var r = c().result;
  var screen = document.getElementById('screen');
  var bar = document.getElementById('steps-bar');
  // All dots done
  var total = q().length;
  var html = '';
  for(var i=0;i<total;i++){
    if(i>0) html += '<div class="step-line done"></div>';
    html += '<div class="step-dot done"></div>';
  }
  bar.innerHTML = html;
  document.getElementById('lbl-step').textContent = '';

  screen.innerHTML = '<div class="result-card">'
    +'<div class="result-icon">'+r.icon+'</div>'
    +'<h1 class="result-h1">'+r.title+'</h1>'
    +'<p class="result-sub">'+r.sub(answers)+'</p>'
    +'<a href="dashboard.html" class="result-cta">'+r.cta+' <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M3 9h12M9 3l6 6-6 6" stroke="#060d0a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></a>'
    +renderMentorRec()
    +'<button class="result-restart" onclick="restart()">'+r.restart+'</button>'
    +'</div>';
}

function restart(){
  step=0; answers={}; renderAll();
}
